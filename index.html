<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Đánh Giá Giáo Viên Ẩn Danh - Cicada 3008</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        <header class="text-center space-y-2">
            <h1 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 tracking-wider">
                🤫 REVIEW GIÁO VIÊN ẨN DANH
            </h1>
            <p class="text-sm md:text-base text-gray-400 font-mono">Hệ thống bảo mật tối cao bởi Đặc vụ Cicada 3008</p>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <section class="md:col-span-1 bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-2xl h-fit space-y-4">
                <h2 class="text-lg font-bold text-purple-400 flex items-center gap-2">✍️ Viết Đánh Giá</h2>
                
                <div class="space-y-1">
                    <label class="text-xs text-gray-400 font-semibold">Chọn Thầy/Cô:</label>
                    <select id="teacherSelect" class="w-full bg-gray-850 border border-gray-700 rounded-xl p-2.5 text-sm text-gray-200 focus:outline-none focus:border-purple-500">
                        <option value="" disabled selected>-- Chọn Giáo Viên --</option>
                        <option value="Thầy Thắng Toán">Thầy Thắng Toán 📐</option>
                        <option value="Cô Mai Văn">Cô Mai Văn 📖</option>
                        <option value="Thầy Tùng Anh">Thầy Tùng Anh 🇬🇧</option>
                        <option value="Cô Linh Hóa">Cô Linh Hóa 🧪</option>
                        <option value="Thầy Nam Lý">Thầy Nam Lý ⚡</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="text-xs text-gray-400 font-semibold">Mức độ vui tính / dễ tính:</label>
                    <div id="ratingStars" class="flex gap-2 text-2xl cursor-pointer py-1">
                        <span class="star text-gray-600 transition-colors duration-200" data-value="1">★</span>
                        <span class="star text-gray-600 transition-colors duration-200" data-value="2">★</span>
                        <span class="star text-gray-600 transition-colors duration-200" data-value="3">★</span>
                        <span class="star text-gray-600 transition-colors duration-200" data-value="4">★</span>
                        <span class="star text-gray-600 transition-colors duration-200" data-value="5">★</span>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs text-gray-400 font-semibold">Lời review ẩn danh:</label>
                    <textarea id="reviewComment" rows="4" placeholder="Nhập văn từ tế, không thô tục nha con trai..." class="w-full bg-gray-850 border border-gray-700 rounded-xl p-2.5 text-sm text-gray-200 focus:outline-none focus:border-purple-500 resize-none"></textarea>
                </div>

                <button id="submitBtn" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-bold py-2.5 px-4 rounded-xl text-sm transition-all shadow-lg shadow-purple-500/20 cursor-pointer">
                    Gửi Đánh Giá Ẩn Danh
                </button>
            </section>

            <section class="md:col-span-2 space-y-6">
                <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-2xl space-y-3">
                    <h2 class="text-lg font-bold text-yellow-500">📊 Bảng Điểm Trung Bình</h2>
                    <div id="statsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        </div>
                </div>

                <div class="space-y-3">
                    <h2 class="text-lg font-bold text-pink-500">💬 Luồng Bình Luận Của Trường</h2>
                    <div id="reviewsContainer" class="space-y-3 max-h-[500px] overflow-y-auto pr-2">
                        </div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
