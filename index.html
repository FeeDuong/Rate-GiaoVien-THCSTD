<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rating GIÁO VIÊN V2 - THCS Tân Dân</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-8">
        <header class="text-center space-y-2">
            <h1 class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-orange-500 to-red-500 tracking-wider">
                Rating GIÁO VIÊN V2
            </h1>
            <p class="text-sm text-gray-400 font-mono">Hệ thống Thang điểm 10★ Siêu Ngầu - THCS Tân Dân</p>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <section class="md:col-span-1 bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-2xl h-fit space-y-5">
                <h2 class="text-xl font-bold text-orange-400 flex items-center gap-2">✍️ Viết Đánh Giá</h2>
                
                <div class="space-y-1">
                    <label class="text-xs text-gray-400 font-semibold">Chọn Thầy/Cô:</label>
                    <select id="teacherSelect" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-sm text-gray-200 focus:outline-none focus:border-orange-500 transition-colors">
                        <option value="" disabled selected>-- Chọn Giáo Viên --</option>
                        <option value="Cô Lan Hiệu trưởng">Cô Lan (Hiệu trưởng) 👑</option>
                        <option value="Thầy Toàn Hiệu phó">Thầy Toàn (Hiệu phó) 🏛️</option>
                        <option value="Cô Hải Thư viện">Cô Hải (Thư viện) 📚</option>
                        <option value="Cô Vẻ">Cô Vẻ ✨</option>
                        <option value="Cô Tính">Cô Tính 📝</option>
                        <option value="Cô Mạc Huyền">Cô Mạc Huyền 🔮</option>
                        <option value="Cô Hiệp">Cô Hiệp 🛡️</option>
                        <option value="Cô Hà Loan">Cô Hà Loan 🌸</option>
                        <option value="Cô Ngân">Cô Ngân 💰</option>
                        <option value="Thầy Toan">Thầy Toan 📐</option>
                        <option value="Thầy Tuân">Thầy Tuân 🚀</option>
                    </select>
                </div>

                <div class="space-y-2 p-3 bg-gray-950 rounded-xl border border-gray-800">
                    <label class="text-xs text-gray-400 font-semibold block">Chế độ danh tính:</label>
                    <div class="flex items-center gap-4">
                        <label class="inline-flex items-center cursor-pointer text-sm">
                            <input type="radio" name="identityMode" value="anonymous" checked class="sr-only peer">
                            <div class="px-3 py-1.5 rounded-lg bg-gray-800 border border-gray-700 text-gray-400 peer-checked:bg-orange-500/20 peer-checked:border-orange-500 peer-checked:text-orange-400 transition-all font-bold">
                                🕵️ Ẩn danh
                            </div>
                        </label>
                        <label class="inline-flex items-center cursor-pointer text-sm">
                            <input type="radio" name="identityMode" value="public" class="sr-only peer">
                            <div class="px-3 py-1.5 rounded-lg bg-gray-800 border border-gray-700 text-gray-400 peer-checked:bg-green-500/20 peer-checked:border-green-500 peer-checked:text-green-400 transition-all font-bold">
                                 Hiện tên
                            </div>
                        </label>
                    </div>
                    <div id="nameInputWrapper" class="hidden mt-2">
                        <input type="text" id="studentName" placeholder="Nhập tên... (Ví dụ: Tuấn 9B)" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-gray-200 focus:outline-none focus:border-green-500">
                    </div>
                </div>

                <div class="space-y-1 text-center">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs text-gray-400 font-semibold italic">Chạm sao để chấm điểm:</label>
                        <span id="ratingDisplay" class="text-sm font-black text-yellow-500 font-mono bg-gray-950 px-2 py-0.5 rounded border border-gray-800">0/10★</span>
                    </div>
                    <div id="ratingStars" class="flex flex-wrap gap-1 text-2xl cursor-pointer py-3 select-none justify-center bg-gray-950 rounded-xl p-2 border border-gray-800 shadow-inner">
                        <span class="star" data-value="1" style="color: #4b5563; transition: all 0.15s; display: inline-block; padding: 0 2px;">★</span>
                        <span class="star" data-value="2" style="color: #4b5563; transition: all 0.15s; display: inline-block; padding: 0 2px;">★</span>
                        <span class="star" data-value="3" style="color: #4b5563; transition: all 0.15s; display: inline-block; padding: 0 2px;">★</span>
                        <span class="star" data-value="4" style="color: #4b5563; transition: all 0.15s; display: inline-block; padding: 0 2px;">★</span>
                        <span class="star" data-value="5" style="color: #4b5563; transition: all 0.15s; display: inline-block; padding: 0 2px;">★</span>
                        <span class="star" data-value="6" style="color: #4b5563; transition: all 0.15s; display: inline-block; padding: 0 2px;">★</span>
                        <span class="star" data-value="7" style="color: #4b5563; transition: all 0.15s; display: inline-block; padding: 0 2px;">★</span>
                        <span class="star" data-value="8" style="color: #4b5563; transition: all 0.15s; display: inline-block; padding: 0 2px;">★</span>
                        <span class="star" data-value="9" style="color: #4b5563; transition: all 0.15s; display: inline-block; padding: 0 2px;">★</span>
                        <span class="star" data-value="10" style="color: #4b5563; transition: all 0.15s; display: inline-block; padding: 0 2px;">★</span>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs text-gray-400 font-semibold">Lời review của con:</label>
                    <textarea id="reviewComment" rows="4" placeholder="Nhập nhận xét tại đây..." class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-sm text-gray-200 focus:outline-none focus:border-orange-500 resize-none transition-colors"></textarea>
                </div>

                <button id="submitBtn" class="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold py-3 px-4 rounded-xl text-sm transition-all shadow-lg shadow-orange-500/20 cursor-pointer transform active:scale-95">
                    Gửi Đánh Giá Ngay
                </button>
            </section>

            <section class="md:col-span-2 space-y-6">
                <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-2xl space-y-4">
                    <h2 class="text-xl font-bold text-yellow-500 flex items-center gap-2">📊 Bảng Điểm Hệ 10 Sao</h2>
                    <div id="statsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
                </div>

                <div class="space-y-4">
                    <h2 class="text-xl font-bold text-red-400 flex items-center gap-2">💬 Luồng Bình Luận Của Trường</h2>
                    <div id="reviewsContainer" class="space-y-4 max-h-[600px] overflow-y-auto pr-2"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
